# Cloudflare Worker（带静态资源）配置。
#
# 为什么不是 Pages：Cloudflare 新版接入流程走 `wrangler deploy` 部署 Worker，
# Pages 正在被并入 Workers。功能一样，这个形态更长久。

name = "guoqing-indonesia-travel"
main = "worker.js"
compatibility_date = "2026-05-22"

# public/ 里的文件直接由边缘节点提供，命中不会唤起 Worker
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"                                        # 代码里读的是 env.DB，别改
database_name = "guoqing-indonesia"
database_id = "027fadf5-bf69-483f-b31a-63bda3434e35"  # APAC 区
