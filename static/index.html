<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>国庆印尼旅游 · 岛屿之间</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f4f7f8; --card:#fff; --fg:#16323c; --muted:#5f7c86; --line:#dde7ea;
  --primary:#0d6e7e; --primary-soft:#e4f2f4; --warn:#a8541b; --warn-soft:#fdf1e6;
  --radius:12px; --safe:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{
  --bg:#0e1f27; --card:#16303a; --fg:#e6f2f4; --muted:#a6c0c8; --line:#2b4b56;
  --primary:#5fd0c8; --primary-soft:#1d3f49; --warn:#f0b27a; --warn-soft:#33291d;
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:calc(28px + var(--safe));
}
h1,h2,h3,h4{margin:0;font-weight:650;line-height:1.35}
p{margin:.5em 0}
a{color:var(--primary)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-height:42px}
input:focus,select,textarea:focus{outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
textarea{resize:vertical;line-height:1.6}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 19px,calc(100% - 10px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}

/* ---------- 布局骨架 ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar{display:flex;align-items:center;gap:10px;height:54px}
.logo{font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.logo small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:500}
.topbar .spacer{flex:1}
.ghost{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;display:inline-flex;align-items:center;gap:5px;min-height:40px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;padding:11px 13px;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* ---------- 通用块 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.sec{margin:22px 0 12px;display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec h2{font-size:20px;flex:1;min-width:0}
.eyebrow{color:var(--primary);font-size:11.5px;letter-spacing:1.6px;font-weight:700;margin:0 0 4px}
.muted{color:var(--muted)}
small,.small{font-size:12.5px;color:var(--muted);line-height:1.55}
.tip{background:var(--primary-soft);border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.65;margin:10px 0}
.tip.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary);border-radius:20px;font-size:12px;padding:4px 10px;line-height:1.4}
.chip.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}
a.chip{padding:9px 14px;min-height:38px;text-decoration:none;font-size:13px}
.btn{background:var(--primary);color:#fff;border-radius:9px;padding:11px 16px;font-size:15px;font-weight:550;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
html[data-theme="dark"] .btn:not(.out){color:#0d2b33}  /* 描边按钮要留青色字，不能一起刷深 */
.btn.sm{padding:8px 12px;font-size:13.5px;min-height:38px}
.btn.out{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.iconbtn{width:42px;height:42px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:0 0 auto}
.iconbtn:hover{background:var(--primary-soft);color:var(--primary)}
.hidden{display:none !important}
.empty{text-align:center;padding:44px 16px;color:var(--muted)}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--fg)}

/* ---------- 首屏 ---------- */
.hero{padding:22px 0 4px}
.hero h1{font-size:27px;line-height:1.4;margin:8px 0 10px;letter-spacing:-.4px}
.hero .sub{font-size:15px;color:var(--muted);margin-bottom:14px}
.overview{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
.ov{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.ov .n{font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1px}
.ov h3{font-size:16.5px;margin:3px 0 4px}
.ov p{font-size:13.5px;color:var(--muted);margin:0}

/* ---------- 示意地图 ---------- */
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 0 10px;margin:12px 0;overflow:hidden}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 14px}
.mapscroll svg{display:block;width:862px;max-width:none;height:auto}
@media(min-width:910px){.mapscroll svg{width:100%}}
.mapscroll{position:relative}
.swipehint{padding:6px 16px 0;font-size:12px;color:var(--primary)}
@media(min-width:910px){.swipehint{display:none}}
.pin{cursor:pointer}
.pin circle.hit{fill:transparent}
.pin:hover circle.dot,.pin:focus circle.dot{r:9}
.maplegend{padding:8px 16px 0;font-size:12.5px;color:var(--muted);line-height:1.6}

/* ---------- 每日行程（攻略） ---------- */
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;overflow:hidden}
.day>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:15px 16px;cursor:pointer}
.day>summary::-webkit-details-marker{display:none}
.day .date{font-size:19px;color:var(--primary);font-weight:600;font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:52px}
.day .ttl{flex:1;min-width:0}
.day .ttl strong{display:block;font-size:15.5px;font-weight:600}
.day .ttl small{display:block}
.day .caret{flex:0 0 auto;color:var(--muted);transition:transform .18s}
.day[open] .caret{transform:rotate(180deg)}
.daybody{padding:0 16px 16px;border-top:1px solid var(--line)}
.tl{display:grid;grid-template-columns:76px 1fr;gap:10px 12px;padding:14px 0 0}
.tl time{font-size:13px;color:var(--primary);font-variant-numeric:tabular-nums;padding-top:2px;overflow-wrap:anywhere}
.tl h4{font-size:15px;margin-bottom:2px}
.tl p{font-size:13.5px;color:var(--muted);margin:0}

/* ---------- 路线计划（可编辑时间段） ---------- */
.slot{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;background:var(--card)}
.slot.editing{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.slothead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.slottime{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--primary);font-weight:600;flex:1;min-width:0}
.slot h4{font-size:15.5px;margin-bottom:4px;overflow-wrap:anywhere}
.slot .body{font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.timepick{display:flex;gap:10px 18px;flex-wrap:wrap;margin-bottom:4px}
.timepick .trow{display:flex;align-items:center;gap:8px}
.timepick .tlab{font-size:13px;color:var(--muted);font-weight:600;flex:0 0 auto}
.timepick .grp{display:flex;align-items:center;gap:4px}
.timepick select{width:auto;min-width:68px;padding:8px 24px 8px 9px;background-position:calc(100% - 13px) 18px,calc(100% - 8px) 18px}
.timepick .sep{color:var(--muted);font-size:13.5px}
.fieldlabel{font-size:12.5px;color:var(--muted);font-weight:600;display:block;margin:10px 0 5px}
.packhint{background:var(--primary-soft);border-radius:10px;padding:12px 14px;margin:14px 0 4px}
.packhint h4{font-size:13.5px;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}

/* ---------- 列表类 ---------- */
.list{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){
  .list.two{grid-template-columns:1fr 1fr}
  .overview{grid-template-columns:repeat(3,1fr)}
  .hero h1{font-size:36px}
}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.item h4{font-size:15.5px;overflow-wrap:anywhere}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.check{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.check input{width:22px;height:22px;min-height:0;flex:0 0 auto;margin-top:1px;accent-color:var(--primary)}
.check .t{flex:1;min-width:0}
.check h4{font-size:15px;font-weight:550;overflow-wrap:anywhere}
.check.done h4{text-decoration:line-through;color:var(--muted)}
.grouphead{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.5px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grouphead::after{content:"";flex:1;height:1px;background:var(--line)}
.flightpath{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;color:var(--primary);margin:6px 0 8px}
.flightpath .arr{flex:1;height:1px;background:var(--line);position:relative;min-width:24px}
.flightpath .arr::after{content:"";position:absolute;right:0;top:-3px;border-left:6px solid var(--line);border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.money{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats .ov{padding:12px 10px;text-align:center}
.stats strong{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
.stats span{font-size:11.5px;color:var(--muted)}
.filterbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.filterbar::-webkit-scrollbar{display:none}
.filterbar button{flex:0 0 auto;border:1px solid var(--line);border-radius:20px;padding:9px 15px;font-size:13px;color:var(--muted);min-height:42px}
.filterbar button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
html[data-theme="dark"] .filterbar button[aria-pressed="true"]{color:#0d2b33}

/* ---------- 弹层 ---------- */
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--fg);width:min(560px,calc(100vw - 24px));max-height:86dvh}
dialog::backdrop{background:rgba(6,24,30,.55)}
.dlg{padding:20px;overflow-y:auto;max-height:86dvh}
.dlg h3{font-size:18px;margin-bottom:4px}
.dlg .fld{margin:14px 0}
.dlghead{display:flex;align-items:flex-start;gap:12px;margin-bottom:2px}
.dlghead h3{flex:1}
footer.foot{margin-top:34px;padding:18px 0 6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.7}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="logo">岛屿之间<small>INDONESIA 2026</small></div>
      <div class="spacer"></div>
      <button class="ghost" id="themeBtn" aria-label="切换深色模式">🌙 <span>夜间</span></button>
      <button class="ghost" id="aboutBtn">怎么用</button>
    </div>
  </div>
  <div class="wrap" style="padding:0">
    <nav class="tabs" id="tabs" role="tablist">
      <button role="tab" data-tab="guide" aria-selected="true">旅行攻略</button>
      <button role="tab" data-tab="route" aria-selected="false">路线计划</button>
      <button role="tab" data-tab="pack" aria-selected="false">行李清单</button>
      <button role="tab" data-tab="flight" aria-selected="false">航班</button>
      <button role="tab" data-tab="music" aria-selected="false">旅途歌单</button>
      <button role="tab" data-tab="budget" aria-selected="false">预算</button>
      <button role="tab" data-tab="note" aria-selected="false">笔记</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
"use strict";
/* =========================================================================

   - 全部改动保存在本机浏览器 localStorage，不上传任何服务器

const KEY = "idn2026.v1";
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------------- 原始攻略数据（来源：V9 方案 B） ---------------- */
const DAYS = [

   ["21:50","广州 → 雅加达","次日当地 02:00 抵达 CGK T3。机上优先睡觉，证件与入境确认页离线保存。"]]},

   ["16:00","入住、港口散步、晚餐","此段为 UTC+8。确认次日集合时间，22:00 前休息；不安排远距离景点。"]]},
 {date:"2026-10-03",title:"科莫多国家公园完整一日",tag:"核心日 · 山海",zone:"UTC+8",items:[

  const routes = {};

    routes[d.date] = d.items.map(([t, title, note]) => {
      const range = /^(\d{1,2}:\d{2})\s*[–-]\s*(\d{1,2}:\d{2})$/.exec(t);
      const one   = /^(\d{1,2}:\d{2})$/.exec(t);
      return {
        id: uid(),
        start: range ? range[1] : one ? one[1] : "",
        end:   range ? range[2] : "",

        title, notes: note

const readFields = root => {
  const o = {};
  $$("[data-f]", root).forEach(el => (o[el.dataset.f] = el.value.trim()));
  return o;
};
const findSlot = key => {
  const [date, id] = key.split("/");
  return [date, (S.routes[date] || []).find(s => s.id === id)];
};

document.addEventListener("click", e => {
  const pin = e.target.closest(".pin");
  if (pin) {
    const d = PINS[+pin.dataset.pin].d.match(/\d{2}\/\d{2}/);
    if (d) {
      const date = `2026-${d[0].replace("/", "-")}`;
      tab = "route"; openDays.route.add(date); render();
      $(`#r-${date}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    return;
  }
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const a = btn.dataset.act, id = btn.dataset.id;
  const dlgRoot = $("#dlgBody");

  switch (a) {
    case "close": closeDlg(); break;

    /* 路线时间段 */
    case "slot-add": {
      const d = btn.dataset.date;
      const s = { id: uid(), start: "", end: "", label: "", title: "", notes: "" };
      (S.routes[d] ||= []).push(s);
      openDays.route.add(d);
      editingSlot = `${d}/${s.id}`;
      save(); render();
      $(`[data-slot="${editingSlot}"]`)?.scrollIntoView({ behavior: "smooth", block: "center" });
      break;
    }
    case "slot-edit": editingSlot = btn.dataset.key; render();
      $(`[data-slot="${editingSlot}"]`)?.scrollIntoView({ block: "center" }); break;
    case "slot-cancel": editingSlot = null; render(); break;
    case "slot-save": {
      const root = btn.closest(".slot");
      const [, s] = findSlot(btn.dataset.key);
      if (s) {
        s.start = readTime(root, "start");
        s.end   = readTime(root, "end");
        if (s.start) s.label = "";
        s.title = $('[data-f="title"]', root).value.trim();
        s.notes = $('[data-f="notes"]', root).value.trim();
      }
      editingSlot = null; save(); render(); toast("已保存到这台手机");
      break;
    }
    case "slot-del": {
      const [date, s] = findSlot(btn.dataset.key);
      if (s && confirm("删除这个时间段？")) {
        S.routes[date] = S.routes[date].filter(x => x.id !== s.id);
        editingSlot = null; save(); render();
      }
      break;
    }

    /* 行李清单 */
    case "pack-filter": packFilter = btn.dataset.c; render(); break;
    case "pack-add": openDlg(packDlg(null)); break;
    case "pack-edit": e.preventDefault(); openDlg(packDlg(S.pack.find(p => p.id === id))); break;
    case "pack-save": {
      const v = readFields(dlgRoot);
      if (!v.title) { toast("先填一下要带什么"); break; }
      const day = dayFromOpt(v.day);
      const ex = S.pack.find(p => p.id === id);
      if (ex) Object.assign(ex, { title: v.title, cat: v.cat, day });
      else S.pack.unshift({ id: uid(), title: v.title, cat: v.cat, day, done: false });
      save(); closeDlg(); render(); break;
    }
    case "pack-del":
      if (confirm("删除这一条？")) { S.pack = S.pack.filter(p => p.id !== id); save(); closeDlg(); render(); }
      break;

    /* 航班 */
    case "flight-edit": openDlg(flightDlg(S.flights.find(f => f.id === id))); break;
    case "flight-save": {
      Object.assign(S.flights.find(f => f.id === id), readFields(dlgRoot));
      save(); closeDlg(); render(); break;
    }

    /* 歌单 */
    case "music-filter": musicFilter = btn.dataset.c; render(); break;
    case "like": {
      const t = btn.dataset.t;
      S.liked = S.liked.includes(t) ? S.liked.filter(x => x !== t) : [...S.liked, t];
      save(); render(); break;
    }

    /* 预算 */
    case "bud-add": openDlg(budDlg(null)); break;
    case "bud-edit": openDlg(budDlg(S.budget.find(b => b.id === id))); break;
    case "bud-save": {
      const v = readFields(dlgRoot);
      if (!v.title) { toast("先填项目名"); break; }
      const ex = S.budget.find(b => b.id === id);
      if (ex) Object.assign(ex, v); else S.budget.unshift({ id: uid(), ...v });
      save(); closeDlg(); render(); break;
    }
    case "bud-del":
      if (confirm("删除这笔？")) { S.budget = S.budget.filter(b => b.id !== id); save(); closeDlg(); render(); }
      break;

    /* 笔记 */
    case "note-add": openDlg(noteDlg(null)); break;
    case "note-edit": openDlg(noteDlg(S.notes.find(n => n.id === id))); break;
    case "note-save": {
      const v = readFields(dlgRoot);
      if (!v.title) { toast("先填标题"); break; }
      const ex = S.notes.find(n => n.id === id);
      if (ex) Object.assign(ex, v); else S.notes.unshift({ id: uid(), ...v });
      save(); closeDlg(); render(); break;
    }
    case "note-del":
      if (confirm("删除这条笔记？")) { S.notes = S.notes.filter(n => n.id !== id); save(); closeDlg(); render(); }
      break;

    case "reset":
      if (confirm("会清掉你所有的改动，恢复成原始攻略。确定吗？")) {
        S = seed(); save(); closeDlg(); render(); toast("已恢复原始攻略");
      }
      break;
  }
});

document.addEventListener("change", e => {
  const cb = e.target.closest('[data-act="pack-toggle"]');
  if (cb) {
    const p = S.pack.find(x => x.id === cb.dataset.id);
    if (p) { p.done = cb.checked; save(); render(); }
  }
});

document.addEventListener("toggle", e => {
  const d = e.target.dataset?.day;
  if (!d || !openDays[tab]) return;
  e.target.open ? openDays[tab].add(d) : openDays[tab].delete(d);
}, true);

$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) { tab = b.dataset.tab; editingSlot = null; render(); }
});
$("#themeBtn").addEventListener("click", () => {
  S.theme = S.theme === "dark" ? "light" : "dark"; save(); render();
});
$("#aboutBtn").addEventListener("click", () => openDlg(aboutDlg()));
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") closeDlg(); });
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.closest(".pin")) e.target.click();
});

/* 首次打开跟随系统深浅色 */
if (!S.theme) S.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
render();
</script>
</body>
</html>
